<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="t">
  <title id="t">Terise kaardivaade: põllud külvikorra värvides, masina liikumisjälg ja põllu andmekaart</title>
  <defs>
    <pattern id="rows" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3"/>
    </pattern>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0b1f12" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- aluskaart -->
  <rect width="1200" height="750" fill="#e7ecdf"/>
  <path d="M0 520 C180 470 260 600 430 560 S760 430 900 470 1120 600 1200 560 V750 H0Z" fill="#d8e3cc"/>
  <path d="M-20 300 C200 330 380 250 560 300 S900 380 1220 320" fill="none" stroke="#f7f4ea" stroke-width="16"/>
  <path d="M-20 300 C200 330 380 250 560 300 S900 380 1220 320" fill="none" stroke="#d4cbb3" stroke-width="2" stroke-dasharray="14 10"/>
  <path d="M640 -20 C620 140 700 260 660 420 S700 640 640 770" fill="none" stroke="#f7f4ea" stroke-width="10"/>
  <path d="M960 0 C1010 120 980 210 1060 300" fill="none" stroke="#9cc3d9" stroke-width="7" stroke-linecap="round"/>
  <g fill="#c9d8b8">
    <circle cx="1090" cy="120" r="34"/><circle cx="1130" cy="160" r="26"/><circle cx="60" cy="640" r="40"/><circle cx="110" cy="690" r="30"/>
  </g>

  <!-- põllud (külvikord värvidega) -->
  <g stroke="#ffffff" stroke-width="3" stroke-linejoin="round">
    <path d="M70 70 L360 50 L390 250 L95 285Z" fill="#e9b949"/>
    <path d="M410 60 L610 75 L600 270 L430 255Z" fill="#7fb069"/>
    <path d="M90 330 L400 300 L430 500 L120 540Z" fill="#4f9d69"/>
    <path d="M450 320 L620 330 L630 520 L470 540Z" fill="#c97b4b"/>
    <path d="M690 60 L930 40 L960 250 L700 280Z" fill="#7fb069"/>
    <path d="M700 330 L1000 360 L980 560 L690 540Z" fill="#e9b949"/>
    <path d="M430 590 L700 580 L710 720 L440 730Z" fill="#a7c957"/>
  </g>
  <g fill="url(#rows)">
    <path d="M70 70 L360 50 L390 250 L95 285Z"/><path d="M700 330 L1000 360 L980 560 L690 540Z"/>
    <path d="M90 330 L400 300 L430 500 L120 540Z"/>
  </g>

  <!-- valitud põld -->
  <path d="M700 330 L1000 360 L980 560 L690 540Z" fill="none" stroke="#10b981" stroke-width="5"/>

  <!-- harimise jälg -->
  <path d="M720 520 L960 538 L966 505 L716 488 L722 456 L972 474 L978 441 L726 424 L730 392 L984 410"
        fill="none" stroke="#0b8f63" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.85"/>

  <!-- masin -->
  <g transform="translate(984 410)">
    <circle r="22" fill="#10b981"/>
    <circle r="22" fill="none" stroke="#ffffff" stroke-width="4"/>
    <path d="M-9 4 h18 v-6 l-4 -6 h-8 v6 h-6z" fill="#ffffff"/>
    <circle cx="-6" cy="7" r="4" fill="#ffffff"/><circle cx="7" cy="7" r="3" fill="#ffffff"/>
  </g>
  <g transform="translate(250 180)">
    <circle r="16" fill="#1d6fb8"/><circle r="16" fill="none" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- ülariba -->
  <g filter="url(#sh)">
    <rect x="24" y="20" width="420" height="48" rx="14" fill="#ffffff"/>
  </g>
  <text x="48" y="51" font-family="Outfit, 'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#1d2a1f">TERIS</text>
  <rect x="130" y="32" width="88" height="24" rx="12" fill="#e8f6ef"/>
  <text x="174" y="49" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#0b8f63">Hooaeg 2026</text>
  <rect x="228" y="32" width="96" height="24" rx="12" fill="#f1f3ee"/>
  <text x="276" y="49" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#556358">Külvikord</text>
  <rect x="334" y="32" width="96" height="24" rx="12" fill="#f1f3ee"/>
  <text x="382" y="49" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#556358">Masinad</text>

  <!-- põllu andmekaart -->
  <g filter="url(#sh)">
    <rect x="860" y="96" width="316" height="214" rx="16" fill="#ffffff"/>
  </g>
  <g font-family="'Plus Jakarta Sans', sans-serif">
    <text x="884" y="132" font-size="13" font-weight="700" fill="#556358" letter-spacing="0.5">PÕLD 12</text>
    <text x="884" y="160" font-size="22" font-weight="800" fill="#1d2a1f" font-family="Outfit, sans-serif">Talinisu · 24,3 ha</text>
    <line x1="884" y1="178" x2="1152" y2="178" stroke="#dfe5dc"/>
    <circle cx="892" cy="203" r="6" fill="#10b981"/>
    <text x="906" y="208" font-size="14" fill="#1d2a1f">Kultiveerimine</text>
    <text x="1152" y="208" text-anchor="end" font-size="14" font-weight="700" fill="#0b8f63">tehtud</text>
    <circle cx="892" cy="235" r="6" fill="#e9b949"/>
    <text x="906" y="240" font-size="14" fill="#1d2a1f">Külv</text>
    <text x="1152" y="240" text-anchor="end" font-size="14" font-weight="700" fill="#b7791f">pooleli · 62%</text>
    <circle cx="892" cy="267" r="6" fill="#c3cbbf"/>
    <text x="906" y="272" font-size="14" fill="#1d2a1f">Väetamine</text>
    <text x="1152" y="272" text-anchor="end" font-size="14" font-weight="600" fill="#556358">planeeritud</text>
    <rect x="884" y="288" width="268" height="6" rx="3" fill="#eef2ea"/>
    <rect x="884" y="288" width="166" height="6" rx="3" fill="#10b981"/>
  </g>

  <!-- legend -->
  <g filter="url(#sh)">
    <rect x="24" y="640" width="370" height="86" rx="14" fill="#ffffff"/>
  </g>
  <g font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#1d2a1f">
    <rect x="44" y="660" width="14" height="14" rx="3" fill="#e9b949"/><text x="66" y="672">Talinisu</text>
    <rect x="150" y="660" width="14" height="14" rx="3" fill="#7fb069"/><text x="172" y="672">Oder</text>
    <rect x="44" y="692" width="14" height="14" rx="3" fill="#4f9d69"/><text x="66" y="704">Raps</text>
    <rect x="150" y="692" width="14" height="14" rx="3" fill="#c97b4b"/><text x="172" y="704">Hernes</text>
    <rect x="256" y="660" width="14" height="14" rx="3" fill="#a7c957"/><text x="278" y="672">Kaer</text>
  </g>
</svg>
